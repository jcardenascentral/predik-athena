[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predik-athena"
version = "1.0.0"
description = "Conexión a Athena para apps Predik: credenciales temporales, workgroup con límites, mock local"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
mock = ["duckdb>=1.0"]
test = ["pytest>=8", "duckdb>=1.0"]

[tool.setuptools]
packages = ["predik_athena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
